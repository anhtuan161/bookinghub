# Cấu hình deploy backend lên Render (Blueprint).
# Render đọc file này khi bạn tạo dịch vụ bằng "New + → Blueprint".
services:
  - type: web
    name: bookinghub-api
    runtime: node
    rootDir: backend            # code backend nằm trong thư mục backend/
    plan: free                  # gói miễn phí (ngủ sau ~15' không dùng)
    region: singapore           # gần Việt Nam nhất
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true            # tự deploy lại mỗi khi push lên GitHub
    envVars:
      - key: DEMO_MODE
        value: "true"           # đổi "false" khi đã có Google/Claude để đọc sheet thật
      - key: DATABASE_URL
        sync: false             # BÍ MẬT — nhập tay trong dashboard Render (không lưu vào repo)
      # Khi bật LIVE mode, thêm trong dashboard:
      #   ANTHROPIC_API_KEY (sync:false)
      #   GOOGLE_SERVICE_ACCOUNT_JSON (sync:false)
      #   LLM_MODEL = claude-sonnet-4-6
    # PORT: Render tự cấp — KHÔNG cần đặt (backend đã đọc process.env.PORT)
