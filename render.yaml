# Cấu hình deploy backend lên Render (Blueprint).
# Render đọc file này khi bạn tạo dịch vụ bằng "New + → Blueprint".
services:
  - type: web
    name: bookinghub-api
    runtime: node
    rootDir: backend            # code backend nằm trong thư mục backend/
    plan: free                  # gói miễn phí (ngủ sau ~15' không dùng)
    region: singapore           # gần Việt Nam nhất
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true            # tự deploy lại mỗi khi push lên GitHub
    envVars:
      - key: DEMO_MODE
        value: "false"          # LIVE: đọc Google Sheet thật + LLM bóc tách
      - key: DATABASE_URL
        sync: false             # BÍ MẬT — nhập tay trong dashboard Render (không lưu vào repo)
      # Các biến LIVE đặt trong dashboard (sync:false cho secret):
      #   AUTH_REQUIRED = true
      #   SUPABASE_JWT_SECRET (sync:false)
      #   LLM_PROVIDER = gemini
      #   GEMINI_API_KEY (sync:false)
      #   GEMINI_MODEL = gemini-2.0-flash
      #   GOOGLE_SERVICE_ACCOUNT_JSON (sync:false)  — hoặc dùng Secret Files (/etc/secrets/service-account.json) + GOOGLE_SERVICE_ACCOUNT_FILE
    # PORT: Render tự cấp — KHÔNG cần đặt (backend đã đọc process.env.PORT)
